[package]
name = "mdb2sql"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.9.3", features = [] }

# NIVEL BASICO: serde faz serializacao/deserializacao de dados entre Rust e JSON
# necessario para comunicar com frontend JavaScript
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# NIVEL BASICO: DuckDB binding para Rust, permite queries SQL em banco embedded
duckdb = { version = "1.1", features = ["bundled"] }

# NIVEL TECNICO: Tauri runtime, shell-open permite abrir URLs/arquivos externos
# NIVEL TECNICO: duckdb bundled inclui biblioteca C estatica (no external deps)

[build-dependencies]
# NIVEL BASICO: Tauri build script gera contexto em compile time
tauri-build = { version = "2.0", features = [] }

[dev-dependencies]
tempfile = "3.10"
