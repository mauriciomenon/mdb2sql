[package]
name = "mdb2sql"
version = "1.1.0"
edition = "2021"

[dependencies]
# NIVEL BASICO: Tauri permite criar apps desktop com Rust backend + web frontend
# sem precisar do peso do Electron (usa webview nativo do sistema)
tauri = { version = "2.12", features = [] }
# seletor de arquivo nativo (botao Browse)
tauri-plugin-dialog = "2.8"

# NIVEL BASICO: serde faz serializacao/deserializacao de dados entre Rust e JSON
# necessario para comunicar com frontend JavaScript
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# NIVEL BASICO: DuckDB binding para Rust, permite queries SQL em banco embedded
duckdb = { version = "1.1", features = ["bundled"] }

# NIVEL TECNICO: duckdb bundled inclui biblioteca C estatica (no external deps)

# SQLite (abrir e exportar) com a biblioteca C compilada dentro do exe: a extensao sqlite do DuckDB tem 47 MB
rusqlite = { version = "0.41.1", features = ["bundled"] }
# .mdb/.accdb pelo driver ODBC do Access (odbc32.dll do Windows; sem driver cai no mdbtools embutido)
odbc-api = { version = "29.3", default-features = false, features = ["odbc_version_3_80"] }
# Excel .xlsx (uma aba por tabela)
rust_xlsxwriter = { version = "0.102", features = ["constant_memory"] }

[build-dependencies]
# NIVEL BASICO: Tauri build script gera contexto em compile time
tauri-build = { version = "2.7", features = [] }

[dev-dependencies]
tempfile = "3"
