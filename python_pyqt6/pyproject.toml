# NIVEL BASICO: pyproject.toml para uv (package manager rapido)
# Define dependencias e metadados do projeto

[project]
name = "mdb2sql"
version = "1.2.0"
description = "Desktop viewer and exporter for Access, SQLite and DuckDB databases"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Maurício Menon", email = "54405514+mauriciomenon@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # NIVEL BASICO: PyQt6 para interfaces graficas nativas cross-platform
    "PyQt6>=6.7.0",
    # NIVEL BASICO: DuckDB banco embedded otimizado para analytics
    "duckdb>=2.0.0",
    # NIVEL BASICO: pandas para manipulacao de dados (DuckDB retorna DataFrames)
    "pandas>=2.2.0",
    # .mdb/.accdb pelo driver ODBC do Access (5.3.0: 5.4/5.5 tem menos de 2 semanas)
    "pyodbc==5.3.0",
    # .xlsx em modo streaming (constant_memory), uma aba por tabela
    "xlsxwriter==3.3.1",
]

[project.optional-dependencies]
# NIVEL BASICO: Dependencias opcionais para build/distribuicao
build = [
    "nuitka>=2.5.7",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "openpyxl==3.1.5",
    "pyinstaller>=6.22.3",
    "pytest>=9.0.3",
    "pytest-qt>=4.5.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/ui", "src/shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
