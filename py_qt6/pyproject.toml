# NIVEL BASICO: pyproject.toml para uv (package manager rapido)
# Define dependencias e metadados do projeto

[project]
name = "mdb2sql"
version = "0.1.0"
description = "DuckDB-backed desktop database viewer"
authors = [
    {name = "Maurício Menon", email = "54405514+mauriciomenon@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # NIVEL BASICO: PyQt6 para interfaces graficas nativas cross-platform
    "PyQt6>=6.7.0",

    # NIVEL BASICO: DuckDB banco embedded otimizado para analytics
    "duckdb>=1.1.3",

    # NIVEL BASICO: pandas para manipulacao de dados (DuckDB retorna DataFrames)
    "pandas>=2.2.0",
]

[project.optional-dependencies]
# NIVEL BASICO: Dependencias opcionais para build/distribuicao
build = [
    "nuitka>=2.5.7",
    "pyinstaller>=6.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=9.0.3",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/ui", "src/shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
